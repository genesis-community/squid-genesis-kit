azs:
- name: z1
  cloud_properties:
    availability_zone: test-z1
- name: z2
  cloud_properties:
    availability_zone: test-z2

vm_types:
- name: squid
  cloud_properties:
    instance_type: t3.micro
    ephemeral_disk: {size: 4_096}
- name: test-vm-type
  cloud_properties:
    instance_type: t3.small
    ephemeral_disk: {size: 8_192}
- name: default
  cloud_properties:
    instance_type: m5.large
    ephemeral_disk: {size: 25_000}

networks:
- name: squid
  type: manual
  subnets:
  - range: 10.99.0.0/16
    gateway: 10.99.0.1
    azs: [z1, z2]
    dns:
    - test-dns
    reserved: [ 10.99.0.1 - 10.99.0.15 ]
    static: [ 10.99.0.16 - 10.99.0.30 ]
    cloud_properties:
      subnet: test-subnet
- name: test-network
  type: manual
  subnets:
  - range: 10.99.0.0/16
    gateway: 10.99.0.1
    azs: [z1, z2]
    dns:
    - test-dns
    reserved: [ 10.99.0.1 - 10.99.0.15 ]
    static: [ 10.99.0.16 - 10.99.0.30 ]
    cloud_properties:
      subnet: test-subnet
- name: vip
  type: vip

compilation:
  workers: 5
  reuse_compilation_vms: true
  az: z1
  vm_type: default
  network: default
