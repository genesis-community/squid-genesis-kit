# squid for ubuntu-resolute.  Loaded by the resolute feature, because squid
# 1.1.0 starts Squid with chpst, which the resolute stemcell does not ship.
# squid 2.0.0 builds Squid 7.7 and starts it with setpriv instead.  It merges
# over manifests/releases/squid.yml by release name.
releases:
- name:    squid
  version: 2.0.0
  url:     https://github.com/cloudfoundry-community/squid-boshrelease/releases/download/v2.0.0/squid-2.0.0.tgz
  sha1:    6013e6be18500378c2f0aab7170a25853d287dc5
