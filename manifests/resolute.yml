---
# Ubuntu resolute stemcell.
#
# Loaded by the resolute feature after the base and OCFP fragments, so that it
# wins over the ubuntu-noble default.  The squid manifest grabs the stemcell
# os from params.stemcell_os; the version still comes from
# params.stemcell_version.  The squid release is the same on both stemcells.

params:
  stemcell_os: ubuntu-resolute
